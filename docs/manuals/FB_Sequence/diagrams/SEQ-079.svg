<title id="title-SEQ-079">SEQ-079 — Os fatos devem ser interpretados com o estado: admissão não é execução e encerramento pode ter três desfechos.</title>
<desc id="desc-SEQ-079">Nós: a: Start aceito lote 0 para 81; b: BatchStarted estado Starting; c: Transição terminal; d: BatchFinished; e: Complete / Stopped ou Aborted. Relações: Start aceito lote 0 para 81 → BatchStarted estado Starting: admissão (normal); Transição terminal → BatchFinished: fechamento (normal); Complete / Stopped ou Aborted → BatchFinished: define o desfecho (normal); BatchStarted estado Starting → Transição terminal: ciclo posterior (normal).</desc>
