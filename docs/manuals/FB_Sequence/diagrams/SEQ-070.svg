<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" width="1040" height="480" role="img" aria-labelledby="title-SEQ-070 desc-SEQ-070">
<title id="title-SEQ-070">SEQ-070 — O helper copia o evento e compara EventID; sessão do ACK deve ser validada por seu chamador.</title>
<desc id="desc-SEQ-070">Nós: a: Evento original; b: Cópia na fila; c: Entrada alterada não muda a cópia; d: ACK por EventID retira cabeça; e: Camada chamadora filtra sessão. Relações: Evento original → Cópia na fila: push copia (normal); Entrada alterada não muda a cópia → Cópia na fila: conteúdo preservado (return); Cópia na fila → ACK por EventID retira cabeça: identidade observada (normal); Camada chamadora filtra sessão → ACK por EventID retira cabeça: validação externa (normal).</desc>
