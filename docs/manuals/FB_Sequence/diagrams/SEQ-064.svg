<title id="title-SEQ-064">SEQ-064 — xPush é um pedido por chamada; a fila é responsável pelos IDs dos eventos aceitos.</title>
<desc id="desc-SEQ-064">Nós: a: Evento com ID 900; b: Cada chamada TRUE; c: Fila atribui IDs 1 / 2 / 3; d: Cabeça mais antiga ID 1; e: Chamada FALSE sem inserção. Relações: Evento com ID 900 → Cada chamada TRUE: três chamadas (normal); Cada chamada TRUE → Fila atribui IDs 1 / 2 / 3: um evento por vez (normal); Fila atribui IDs 1 / 2 / 3 → Cabeça mais antiga ID 1: ordem FIFO (normal); Chamada FALSE sem inserção → Cabeça mais antiga ID 1: preserva conteúdo (return).</desc>
