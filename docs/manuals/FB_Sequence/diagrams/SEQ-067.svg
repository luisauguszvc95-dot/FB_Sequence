<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" width="1040" height="480" role="img" aria-labelledby="title-SEQ-067 desc-SEQ-067">
<title id="title-SEQ-067">SEQ-067 — A retirada precede a inserção, permitindo manter ocupação cheia sem perda quando há ACK válido.</title>
<desc id="desc-SEQ-067">Nós: a: Cheia + ACK + push; b: ACK da cabeça?; c: Sim: retira antes abre uma posição; d: Não: segue cheia novo é descartado; e: Insere novo contagem 32. Relações: Cheia + ACK + push → ACK da cabeça?: ordem da chamada (normal); ACK da cabeça? → Sim: retira antes abre uma posição: correto (normal); ACK da cabeça? → Não: segue cheia novo é descartado: incorreto (reject); Sim: retira antes abre uma posição → Insere novo contagem 32: reutiliza posição (normal).</desc>
