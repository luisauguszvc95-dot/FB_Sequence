<title id="title-SEQ-012">SEQ-012 — A disponibilidade para iniciar exige o conjunto das condições, não apenas um bit Ready.</title>
<desc id="desc-SEQ-012">Nós: a: Runtime recebido; b: Validade, Ready e recurso livre; c: Prontidão atendida; d: NotReady sem Acquire. Relações: Runtime recebido → Validade, Ready e recurso livre: verifica (normal); Validade, Ready e recurso livre → Prontidão atendida: condição válida (normal); Validade, Ready e recurso livre → NotReady sem Acquire: condição falha (reject).</desc>
