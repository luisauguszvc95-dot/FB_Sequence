<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" width="1040" height="480" role="img" aria-labelledby="title-SEQ-069 desc-SEQ-069">
<title id="title-SEQ-069">SEQ-069 — ACK não confirma antecipadamente um evento que ainda não existia no início da chamada.</title>
<desc id="desc-SEQ-069">Nós: a: Fila vazia ACK 1 + push; b: ACK avaliado antes; c: Sem cabeça nada a retirar; d: Push cria ID 1; e: Próxima chamada ACK retira ID 1. Relações: Fila vazia ACK 1 + push → ACK avaliado antes: início da chamada (normal); ACK avaliado antes → Sem cabeça nada a retirar: ainda vazia (normal); Sem cabeça nada a retirar → Push cria ID 1: inserção posterior (normal); Push cria ID 1 → Próxima chamada ACK retira ID 1: confirma existente (return).</desc>
<metadata id="diagram-source">{&quot;case_id&quot;:&quot;SEQ-069&quot;,&quot;diagram&quot;:{&quot;nodes&quot;:[{&quot;id&quot;:&quot;a&quot;,&quot;label&quot;:&quot;Fila vazia\nACK 1 + push&quot;,&quot;role&quot;:&quot;input&quot;},{&quot;id&quot;:&quot;b&quot;,&quot;label&quot;:&quot;ACK avaliado antes&quot;,&quot;role&quot;:&quot;process&quot;},{&quot;id&quot;:&quot;c&quot;,&quot;label&quot;:&quot;Sem cabeça\nnada a retirar&quot;,&quot;role&quot;:&quot;output&quot;},{&quot;id&quot;:&quot;d&quot;,&quot;label&quot;:&quot;Push cria ID 1&quot;,&quot;role&quot;:&quot;output&quot;},{&quot;id&quot;:&quot;e&quot;,&quot;label&quot;:&quot;Próxima chamada\nACK retira ID 1&quot;,&quot;role&quot;:&quot;state&quot;}],&quot;edges&quot;:[{&quot;from&quot;:&quot;a&quot;,&quot;to&quot;:&quot;b&quot;,&quot;label&quot;:&quot;início da chamada&quot;,&quot;kind&quot;:&quot;normal&quot;},{&quot;from&quot;:&quot;b&quot;,&quot;to&quot;:&quot;c&quot;,&quot;label&quot;:&quot;ainda vazia&quot;,&quot;kind&quot;:&quot;normal&quot;},{&quot;from&quot;:&quot;c&quot;,&quot;to&quot;:&quot;d&quot;,&quot;label&quot;:&quot;inserção posterior&quot;,&quot;kind&quot;:&quot;normal&quot;},{&quot;from&quot;:&quot;d&quot;,&quot;to&quot;:&quot;e&quot;,&quot;label&quot;:&quot;confirma existente&quot;,&quot;kind&quot;:&quot;return&quot;}],&quot;caption&quot;:&quot;ACK não confirma antecipadamente um evento que ainda não existia no início da chamada.&quot;}}</metadata>
