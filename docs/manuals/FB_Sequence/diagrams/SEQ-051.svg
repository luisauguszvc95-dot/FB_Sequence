<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img" aria-labelledby="seq-051-title seq-051-desc"><title id="seq-051-title">SEQ-051</title><desc id="seq-051-desc">O limite temporal da receita é uma regra estrutural; a execução do núcleo exige outros contratos.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#536679"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#24577A"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#24577A"/></marker></defs><rect width="1040" height="480" fill="#ffffff"/><path d="M 410,112.0 L 424.0,112.0 Q 430,112.0 430.0,106.0 L 430.0,106.0 Q 430,100.0 436.0,100.0 L 630,100.0" fill="none" stroke="#536679" stroke-width="2"/><polygon points="630,100.0 620.0,95.0 620.0,105.0" fill="#536679"/><path d="M 630,112.0 L 618.0,112.0 Q 610,112.0 610.0,120.0 L 610.0,368.0 Q 610,376.0 602.0,376.0 L 410,376.0" fill="none" stroke="#536679" stroke-width="2"/><polygon points="410,376.0 420.0,381.0 420.0,371.0" fill="#536679"/><path d="M 817.0,160 L 817.0,166.0 Q 817.0,172 811.0,172.0 L 811.0,172.0 Q 805.0,172 805.0,178.0 L 805.0,328" fill="none" stroke="#536679" stroke-width="2" stroke-dasharray="6,5"/><polygon points="805.0,328 810.0,318.0 800.0,318.0" fill="#536679"/><rect x="60" y="64" width="350" height="96" rx="4" fill="#F4F6F8" stroke="#CBD4DC" stroke-width="2"/><text x="235.0" y="107.0" text-anchor="middle" font-family="DejaVuSans" font-size="20" fill="#202A34">WaitQualified</text><text x="235.0" y="131.0" text-anchor="middle" font-family="DejaVuSans" font-size="20" fill="#202A34">meta e timeout</text><rect x="630" y="64" width="350" height="96" rx="4" fill="#ffffff" stroke="#536679" stroke-width="2"/><text x="805.0" y="107.0" text-anchor="middle" font-family="DejaVuSans" font-size="20" fill="#202A34">Coerência</text><text x="805.0" y="131.0" text-anchor="middle" font-family="DejaVuSans" font-size="20" fill="#202A34">da duração</text><rect x="60" y="328" width="350" height="96" rx="8" fill="#ffffff" stroke="#536679" stroke-width="2"/><text x="235.0" y="371.0" text-anchor="middle" font-family="DejaVuSans" font-size="20" fill="#202A34">0 &lt; meta ≤ limite</text><text x="235.0" y="395.0" text-anchor="middle" font-family="DejaVuSans" font-size="20" fill="#202A34">válida</text><rect x="630" y="328" width="350" height="96" rx="8" fill="#ffffff" stroke="#536679" stroke-width="2"/><text x="805.0" y="359.0" text-anchor="middle" font-family="DejaVuSans" font-size="20" fill="#202A34">Meta 0 ou acima</text><text x="805.0" y="383.0" text-anchor="middle" font-family="DejaVuSans" font-size="20" fill="#202A34">do timeout</text><text x="805.0" y="407.0" text-anchor="middle" font-family="DejaVuSans" font-size="20" fill="#202A34">rejeitada</text><rect x="456.20703125" y="70.0" width="147.5859375" height="20" fill="#ffffff"/><text x="530.0" y="85.0" text-anchor="middle" font-family="DejaVuSans" font-size="16" fill="#536679">compara tempos</text><rect x="491.280625" y="234.0" width="106.71875" height="20" fill="#ffffff"/><text x="544.64" y="249.0" text-anchor="middle" font-family="DejaVuSans" font-size="16" fill="#536679">meta válida</text><rect x="667.85578125" y="240.0" width="125.1484375" height="20" fill="#ffffff"/><text x="730.43" y="255.0" text-anchor="middle" font-family="DejaVuSans" font-size="16" fill="#536679">zero ou acima</text></svg>