<title id="title-SEQ-077">SEQ-077 — Faulted não encerra o lote; a recuperação conserva o motivo e o lote que existiam antes do reset.</title>
<desc id="desc-SEQ-077">Nós: a: Running; b: Faulted ResourceLost; c: FaultRaised sem BatchFinished; d: Reset para Idle; e: FaultCleared causa e lote antes. Relações: Running → Faulted ResourceLost: falha (normal); Faulted ResourceLost → FaultRaised sem BatchFinished: registra ocorrência (normal); Faulted ResourceLost → Reset para Idle: recuperação (return); Reset para Idle → FaultCleared causa e lote antes: preserva contexto (normal).</desc>
