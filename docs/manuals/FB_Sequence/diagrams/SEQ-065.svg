<title id="title-SEQ-065">SEQ-065 — Somente a identidade da cabeça existente autoriza sua retirada; repetição não avança a fila.</title>
<desc id="desc-SEQ-065">Nós: a: ACK recebido; b: Compara cabeça; c: Igual e não zero retira uma entrada; d: Zero / outro ID preserva cabeça. Relações: ACK recebido → Compara cabeça: identidade do ACK (normal); Compara cabeça → Igual e não zero retira uma entrada: exato e não zero (normal); Compara cabeça → Zero / outro ID preserva cabeça: zero ou diferente (reject).</desc>
